name: Build Sabou Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sabou-Manager-v3-alpha19-dev-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          test -f Sabou-Manager-v3-alpha19-dev-source.zip
          mkdir project
          unzip -q Sabou-Manager-v3-alpha19-dev-source.zip -d project
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        working-directory: project
        run: chmod +x gradlew scripts/verify-foundation.sh

      - name: Static verification
        working-directory: project
        run: bash scripts/verify-foundation.sh

      - name: Test and build debug APK
        working-directory: project
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sabou-manager-alpha19-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sabou-manager-build-reports
          path: project/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
